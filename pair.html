<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading...</title>
<style>
body {
    background: #080b14;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.loader {
    text-align: center;
}
.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #26364b;
    border-top: 4px solid #00bfff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: auto auto 15px;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <p>Loading...</p>
</div>

<script>
setTimeout(function() {
    window.location.replace(
      "https://rizo-mini-bot-production-21495631.up.railway.app"
    );
}, 2000);
</script>

</body>
</html>
